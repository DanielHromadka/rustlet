[package]
name = "rustlet"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[build-dependencies]
cc = "1"

[profile.release]
lto = true
strip = true
