name: macOS installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    name: Prepare installer release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          else
            tag="build-$RUN_ID-$ATTEMPT"
          fi
          gh release create "$tag" --draft --target "$COMMIT" \
            --title "Rustlet $tag" \
            --notes "macOS installers for Apple Silicon and Intel. Source: $COMMIT. Applications use ad hoc signing; PKG installers are unsigned and these builds are not Apple-notarized. SHA-256 checksums are included. These artifacts do not update signed Rustlet/Sparkle feeds."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CODE_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Check architecture
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build and verify installers
        run: ./scripts/package-macos.sh
      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/installers/* --clobber

  publish:
    name: Publish installer downloads
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          fi
          echo "Installers: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  validate-pr:
    name: PR macOS ${{ matrix.arch }}
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CODE_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Check architecture
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build and verify installers
        run: ./scripts/package-macos.sh
